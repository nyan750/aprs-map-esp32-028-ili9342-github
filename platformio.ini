; APRS Map Viewer - ESP32-2432S028 with ILI9342 panel (backlight GPIO21)
; XPT2046 touch on its own bus (CLK25/MISO39/MOSI32/CS33/IRQ36)
[env:esp2432s028]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_mapgen.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    -DCORE_DEBUG_LEVEL=0
